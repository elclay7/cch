name: Deploy to Homelab Server

on:
  push:
    branches:
      - main  # Cambia a 'master' si tu rama principal se llama master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@main

      - name: Desplegar mediante SSH
        uses: appleboy/ssh-action@main
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Crear el directorio base si no existe
            mkdir -p /storage/webservices/cdch

            # Si ya existe un clon anterior en un directorio temporal, actualizarlo o clonar de nuevo
            if [ -d "/storage/webservices/tmp/cdch_repo" ]; then
              rm -rf /storage/webservices/tmp/cdch_repo
            fi

            # Clonar el repositorio actualizado
            git clone https://github.com/elclay7/cdch.git /storage/webservices/tmp/cdch_repo

            # Asegurar que el directorio de destino existe
            mkdir -p /storage/webservices/cdch/html

            # Limpiar el contenido antiguo del sitio web
            rm -rf /storage/webservices/cdch/html/*

            # Copiar el nuevo contenido de la carpeta 'html' al destino final
            cp -r /storage/webservices/tmp/cdch_repo/html/* /storage/webservices/cdch/html/

            # Limpiar directorio temporal
            rm -rf /storage/webservices/tmp/cdch_repo